<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopify | Login & Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="AuthPage">
    <header class="auth-header py-4">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="brand text-white fw-bold fs-4" href="index.html">Shopify</a>
        <a class="text-white text-decoration-none" href="index.html"><i class="fas fa-home me-2"></i>Marketplace</a>
      </div>
    </header>

    <main class="auth-main">
      <div class="container">
        <div class="row align-items-center auth-card shadow-lg rounded-4 overflow-hidden">
          <div class="col-lg-6 auth-side-left bg-gradient">
            <div class="p-5 text-white">
              <h1 class="display-6 fw-bold">Welcome Back</h1>
              <p class="lead text-white-75">Login or sign up to access buyer, seller, and admin dashboards with real-looking commerce flows.</p>
              <div class="d-flex gap-3 mt-4">
                <span class="badge bg-light text-dark py-2 px-3">Secure Login</span>
                <span class="badge bg-light text-dark py-2 px-3">Role Based Access</span>
              </div>
              <div class="mt-5">
                <img src="img/img1.png" alt="Commerce UI" class="img-fluid rounded-4 shadow" />
              </div>
            </div>
          </div>
          <div class="col-lg-6 p-5 auth-side-right bg-white">
            <div class="d-flex align-items-center justify-content-between mb-4">
              <h2 class="fw-bold mb-0">Sign In / Register</h2>
              <div>
                <button class="btn btn-outline-primary btn-sm me-2" id="tab-login">Login</button>
                <button class="btn btn-primary btn-sm" id="tab-signup">Signup</button>
              </div>
            </div>

            <div id="login-form" class="auth-form">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Select Role</label>
                <select id="login-role" class="form-select">
                  <option value="User">User (Customer)</option>
                  <option value="Seller">Seller</option>
                  <option value="Admin">Admin</option>
                </select>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                  <input type="checkbox" id="remember-me" class="form-check-input me-2" />
                  <label for="remember-me" class="form-check-label">Remember me</label>
                </div>
                <button class="btn btn-link text-decoration-none" id="forgot-password">Forgot password?</button>
              </div>
              <button class="btn btn-primary w-100 py-3" id="login-submit">Login</button>
            </div>

            <div id="signup-form" class="auth-form d-none">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="signup-name" class="form-control" placeholder="Jane Doe" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="signup-email" class="form-control" placeholder="you@example.com" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Choose Role</label>
                <select id="signup-role" class="form-select">
                  <option value="User">User (Customer)</option>
                  <option value="Seller">Seller</option>
                </select>
              </div>
              <button class="btn btn-primary w-100 py-3" id="signup-submit">Create Account</button>
            </div>

            <div class="mt-4 text-center text-muted small">
              Need help? Email <a href="mailto:support@shopify.com">support@shopify.com</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
