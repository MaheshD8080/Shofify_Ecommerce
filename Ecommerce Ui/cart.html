<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopify | Cart</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body data-page="CartPage">
    <nav class="topbar navbar navbar-expand-lg navbar-dark bg-dark py-2">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Shopify</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCart">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navCart">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item me-3"><a class="nav-link" href="checkout.html">Checkout</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <p class="text-uppercase text-muted mb-1">Shopping Cart</p>
          <h2 class="section-title mb-0">Review your items</h2>
        </div>
        <div class="text-end">
          <p class="mb-1 text-muted">Items in cart</p>
          <h4 id="cart-count" class="mb-0">0</h4>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div id="cart-items-body" class="row g-3"></div>
        </div>
        <aside class="col-lg-4">
          <div class="card p-4 rounded-4">
            <h5 class="mb-3">Order Summary</h5>
            <div id="cart-summary" class="mb-4">
              <p class="mb-0">Your cart is empty.</p>
            </div>
            <button id="checkout-button" class="btn btn-warning w-100" disabled>Proceed to Checkout</button>
            <p class="text-muted small mt-3">Your cart is saved locally. Add items to enable checkout.</p>
          </div>
        </aside>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
