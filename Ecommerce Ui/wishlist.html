<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="WishlistPage">
    <nav class="topbar navbar navbar-expand-lg navbar-dark bg-dark py-2">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Shopify</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMobile">
          <span class="navbar-toggler-icon"></span>

          <p class="text-muted mb-0">Saved items you want to buy later.</p>
